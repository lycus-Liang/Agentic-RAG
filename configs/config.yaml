# ==========================================
# 🧠 Agentic Omni-Modal RAG 全局配置文件
# ==========================================

# ------------------------------------------
# [离线链路] 文档解析与向量建库 (Ingestion)
# ------------------------------------------
offline:
  models:
    text_encoder: "BAAI/bge-m3"
    vision_encoder: "vidore/colqwen2-v0.1"
    proxy_vlm: "Qwen/Qwen2-VL-2B-Instruct"
  database:
    host: "localhost"
    port: 6333
    collection_name: "Chinese"
    timeout: 120
    batch_size: 10 # 针对多向量的防爆破小批次

# ------------------------------------------
# [在线链路] 多路并发检索与融合 (Serving)
# ------------------------------------------
online:
  models:
    text_encoder: "BAAI/bge-m3"
    vision_encoder: "vidore/colqwen2-v0.1"
    vision_device: "cuda"
    reranker: "BAAI/bge-reranker-v2-m3"

  # 调用 LLM API
  llm_api:
    # 供应商选择：
    # AGICTO：base_url: "https://api.agicto.cn/v1"
    # siliconflow：base_url: "https://api.siliconflow.cn/v1"
    base_url: "https://api.agicto.cn/v1"
    # reasoning_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"   # 用于 HyDE、Critic、Router (速度快、极度便宜)
    # generation_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"       # 用于最终的图文理解与答案生成 (能力强、支持视觉)
    reasoning_model: "gpt-4o-mini"
    generation_model: "gpt-4o-mini"
    
  # # 本地模型（需要先用 vllm 启动本地模型）
  # llm_api:
  #   base_url: "http://127.0.0.1:6666/v1"  # 指向刚刚用 vLLM 启动的本地端口
  #   reasoning_model: "Qwen/Qwen3-8B"      # 名字必须和启动时的 served-model-name 一致
  #   generation_model: "Qwen/Qwen3-8B"
  
  database:
    host: "localhost"
    port: 6333
    collection_name: "omni_rag_docs"
  
  # 🎯 核心控制台：多路召回开关
  # 你可以随时在这里开启/关闭特定维度的检索
  retrieval_strategies:
    use_dense: true   # 开启稠密语义检索
    use_sparse: true  # 开启稀疏关键词检索
    use_vision: true # 是否开启 ColPali 视觉探针检索 (由于极耗显存，默认可关，视需求开启)
    use_hyde: false   # HyDE 引擎总开关
    use_reranker: true # Reranker 开关

  top_k:
    cr_top_k_withReranker: 100
    cr_top_k: 10  # 粗筛
    fr_top_k: 3   # 精筛

  # 工作流开关
  workflow:
    use_agentic_loop: true   # 开启后启用“规划 -> 多跳检索 -> 步骤评估 -> 综合生成”的 Agentic RAG
    max_plan_steps: 4        # 单次问题最多拆解出的检索步骤数
    max_retries: 2           # 单个检索步骤允许 fallback 重搜的最大次数

  # Agent 经验记忆系统：记录成功/失败检索轨迹，用于后续规划和工具选择
  agent_memory:
    enabled: true
    storage_path: "./data/memory/agent_memory.sqlite3"
    retrieve_top_k: 3
    min_reward_to_reuse: 0.3
    write_after_chat: true
    use_llm_reflection: true
    max_experiences: 1000
