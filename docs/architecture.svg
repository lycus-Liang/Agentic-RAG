<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Omni-Modal Agentic RAG Architecture</title>
  <desc id="desc">Architecture diagram for the current omni-modal agentic RAG system, including online workflow, retrieval tools, search style control, retrieval backend, and offline indexing pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .group-title { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 12; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; }
      .box-green { fill: #f0fdf4; stroke: #16a34a; }
      .box-amber { fill: #fffbeb; stroke: #d97706; }
      .box-purple { fill: #faf5ff; stroke: #9333ea; }
      .box-slate { fill: #f1f5f9; stroke: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .line-dashed { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 10; }
      .mono { font: 13px Consolas, monospace; fill: #1e293b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Omni-Modal Agentic RAG Architecture</text>
  <text x="60" y="88" class="small">Current implementation: planning, native tool calls, modality routing, search_style control, Qdrant RRF fusion, optional reranking, and offline indexing.</text>

  <!-- Entry and config -->
  <rect class="group" x="45" y="125" width="330" height="235"/>
  <text x="70" y="162" class="group-title">Entrypoints</text>
  <rect class="box box-blue" x="80" y="190" width="250" height="58"/>
  <text x="205" y="214" text-anchor="middle" class="label">User</text>
  <text x="205" y="236" text-anchor="middle" class="small">question + debug flag</text>
  <rect class="box box-blue" x="80" y="280" width="250" height="58"/>
  <text x="205" y="304" text-anchor="middle" class="label">Streamlit / API / CLI</text>
  <text x="205" y="326" text-anchor="middle" class="small">same GraphState input</text>

  <rect class="group" x="45" y="405" width="330" height="230"/>
  <text x="70" y="442" class="group-title">Runtime Inputs</text>
  <rect class="box box-slate" x="80" y="470" width="250" height="58"/>
  <text x="205" y="494" text-anchor="middle" class="label">configs/config.yaml</text>
  <text x="205" y="516" text-anchor="middle" class="small">workflow + strategy caps</text>
  <rect class="box box-slate" x="80" y="560" width="250" height="58"/>
  <text x="205" y="584" text-anchor="middle" class="label">configs/prompts.yaml</text>
  <text x="205" y="606" text-anchor="middle" class="small">general RAG prompts</text>

  <!-- Online workflow -->
  <rect class="group" x="430" y="125" width="515" height="510"/>
  <text x="455" y="162" class="group-title">Online LangGraph Workflow</text>
  <rect class="box box-purple" x="555" y="190" width="260" height="58"/>
  <text x="685" y="214" text-anchor="middle" class="label">LangGraph Workflow</text>
  <text x="685" y="236" text-anchor="middle" class="small">build_agentic_rag()</text>

  <rect class="box box-purple" x="555" y="290" width="260" height="62"/>
  <text x="685" y="315" text-anchor="middle" class="label">plan_query_node</text>
  <text x="685" y="337" text-anchor="middle" class="small">steps + mode + dependencies</text>

  <rect class="box box-purple" x="555" y="395" width="260" height="72"/>
  <text x="685" y="420" text-anchor="middle" class="label">tool_call_agent_node</text>
  <text x="685" y="442" text-anchor="middle" class="small">native tool calls per step</text>
  <text x="685" y="460" text-anchor="middle" class="tiny">records tool_trace</text>

  <rect class="box box-purple" x="555" y="525" width="260" height="62"/>
  <text x="685" y="550" text-anchor="middle" class="label">generate_node</text>
  <text x="685" y="572" text-anchor="middle" class="small">text + image evidence to LLM</text>

  <rect class="box box-slate" x="455" y="525" width="70" height="62"/>
  <text x="490" y="551" text-anchor="middle" class="label">END</text>
  <text x="490" y="572" text-anchor="middle" class="tiny">output</text>

  <rect class="note" x="835" y="292" width="82" height="172"/>
  <text x="876" y="322" text-anchor="middle" class="small">Traditional</text>
  <text x="876" y="342" text-anchor="middle" class="small">RAG path</text>
  <text x="876" y="374" text-anchor="middle" class="mono">if</text>
  <text x="876" y="394" text-anchor="middle" class="mono">use_agentic</text>
  <text x="876" y="414" text-anchor="middle" class="mono">_loop=false</text>
  <text x="876" y="444" text-anchor="middle" class="small">retrieve_node</text>

  <!-- Tools and search -->
  <rect class="group" x="1000" y="125" width="535" height="510"/>
  <text x="1025" y="162" class="group-title">Retrieval Layer</text>

  <rect class="box box-green" x="1040" y="190" width="220" height="92"/>
  <text x="1150" y="214" text-anchor="middle" class="label">Retrieval Tools</text>
  <text x="1150" y="238" text-anchor="middle" class="mono">retrieve_text</text>
  <text x="1150" y="258" text-anchor="middle" class="mono">retrieve_vision</text>
  <text x="1150" y="278" text-anchor="middle" class="mono">retrieve_hybrid</text>

  <rect class="box box-amber" x="1285" y="190" width="210" height="92"/>
  <text x="1390" y="214" text-anchor="middle" class="label">search_style</text>
  <text x="1390" y="238" text-anchor="middle" class="mono">auto | exact</text>
  <text x="1390" y="258" text-anchor="middle" class="mono">semantic | expanded</text>
  <text x="1390" y="278" text-anchor="middle" class="tiny">agent intent, not raw switches</text>

  <rect class="box box-green" x="1120" y="330" width="260" height="72"/>
  <text x="1250" y="356" text-anchor="middle" class="label">Searcher</text>
  <text x="1250" y="378" text-anchor="middle" class="small">config-capped effective strategy</text>
  <text x="1250" y="396" text-anchor="middle" class="tiny">last_search_metadata</text>

  <rect class="box box-green" x="1120" y="445" width="260" height="72"/>
  <text x="1250" y="471" text-anchor="middle" class="label">QueryEncoder</text>
  <text x="1250" y="493" text-anchor="middle" class="small">BGE-M3 + optional HyDE</text>
  <text x="1250" y="511" text-anchor="middle" class="tiny">ColQwen2 / ColPali if enabled</text>

  <rect class="box box-green" x="1040" y="555" width="455" height="52"/>
  <text x="1268" y="579" text-anchor="middle" class="label">Qdrant RRF Fusion + Optional Reranker</text>
  <text x="1268" y="599" text-anchor="middle" class="tiny">dense / sparse / vision routes fused before generation</text>

  <!-- Strategy note -->
  <rect class="note" x="1000" y="665" width="535" height="115"/>
  <text x="1025" y="697" class="label">Control Boundary</text>
  <text x="1025" y="724" class="small">Agent chooses retrieval tool + search_style.</text>
  <text x="1025" y="748" class="small">configs/config.yaml caps dense, sparse, HyDE, vision, and reranker.</text>

  <!-- Offline pipeline -->
  <rect class="group" x="45" y="700" width="900" height="270"/>
  <text x="70" y="737" class="group-title">Offline Indexing Pipeline</text>
  <rect class="box box-blue" x="80" y="780" width="180" height="62"/>
  <text x="170" y="805" text-anchor="middle" class="label">Raw Files</text>
  <text x="170" y="827" text-anchor="middle" class="small">PDF / JSON</text>

  <rect class="box box-blue" x="310" y="780" width="180" height="62"/>
  <text x="400" y="805" text-anchor="middle" class="label">Parsing</text>
  <text x="400" y="827" text-anchor="middle" class="small">Omniparse / loaders</text>

  <rect class="box box-blue" x="540" y="780" width="180" height="62"/>
  <text x="630" y="805" text-anchor="middle" class="label">Chunks + Crops</text>
  <text x="630" y="827" text-anchor="middle" class="small">proxy descriptions</text>

  <rect class="box box-blue" x="770" y="780" width="140" height="62"/>
  <text x="840" y="805" text-anchor="middle" class="label">Embeddings</text>
  <text x="840" y="827" text-anchor="middle" class="small">text + vision</text>

  <rect class="box box-green" x="540" y="890" width="370" height="52"/>
  <text x="725" y="914" text-anchor="middle" class="label">Qdrant Collection</text>
  <text x="725" y="934" text-anchor="middle" class="small">payloads, vectors, crops, proxy descriptions</text>

  <!-- Debug output -->
  <rect class="group" x="1000" y="820" width="535" height="150"/>
  <text x="1025" y="857" class="group-title">Debug / UI Trace</text>
  <rect class="box box-slate" x="1040" y="885" width="455" height="58"/>
  <text x="1268" y="909" text-anchor="middle" class="label">Show Retrieval Process</text>
  <text x="1268" y="931" text-anchor="middle" class="small">tool, mode, search_style, effective routes, fusion, hit count</text>

  <!-- Arrows -->
  <path class="line" d="M 205 248 L 205 280"/>
  <path class="line" d="M 330 309 C 395 309 455 219 555 219"/>
  <path class="line-dashed" d="M 330 499 C 410 499 460 219 555 219"/>
  <path class="line-dashed" d="M 330 589 C 410 589 460 219 555 219"/>
  <path class="line" d="M 685 248 L 685 290"/>
  <path class="line" d="M 685 352 L 685 395"/>
  <path class="line" d="M 685 467 L 685 525"/>
  <path class="line" d="M 555 556 L 525 556"/>
  <path class="line-dashed" d="M 815 219 C 850 219 876 248 876 292"/>
  <path class="line-dashed" d="M 876 464 C 876 505 850 556 815 556"/>

  <path class="line" d="M 815 431 C 900 431 950 236 1040 236"/>
  <path class="line" d="M 1260 236 L 1285 236"/>
  <path class="line" d="M 1150 282 C 1150 310 1180 330 1250 330"/>
  <path class="line" d="M 1390 282 C 1390 315 1325 330 1250 330"/>
  <path class="line" d="M 1250 402 L 1250 445"/>
  <path class="line" d="M 1250 517 L 1268 555"/>
  <path class="line" d="M 1268 607 C 1268 650 900 556 815 556"/>
  <path class="line-dashed" d="M 1268 607 C 1300 675 1300 820 1268 885"/>

  <path class="line" d="M 260 811 L 310 811"/>
  <path class="line" d="M 490 811 L 540 811"/>
  <path class="line" d="M 720 811 L 770 811"/>
  <path class="line" d="M 840 842 L 840 890"/>
  <path class="line" d="M 725 890 C 760 700 1020 595 1040 581"/>
</svg>
